name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ExpressPath/dmoft-community
          path: dmoft-community
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: client/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ../dmoft-community
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src
      - run: python -m pytest

  billing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: billing
    env:
      DATABASE_URL: postgresql://dmoft:dmoft@127.0.0.1:5432/dmoft_test
      DATABASE_SSL: "false"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dmoft
          POSTGRES_PASSWORD: dmoft
          POSTGRES_DB: dmoft_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dmoft -d dmoft_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: billing/package-lock.json
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run check
